# Cloudflare Workers, built from this GitHub repository. Workers Builds runs the
# build command and then `wrangler deploy`, which uploads `dist` as static assets
# and `worker/index.js` as the small script in front of them.
name = "pingclair-docs"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 🔀 Every hostname the Worker answers on is listed here, because `wrangler
# deploy` makes the Worker's custom domains match this list: a domain bound only
# in the dashboard is detached, DNS record and all, by the next deploy.
#
# - `cf.pingclair.com` is the Worker's own hostname. The Paris node proxies
#   `pingclair.com/mcp` and `/a2a` to it. 🤡 It was bound only in the dashboard,
#   so the deploy of 46edcd8 (2026-10-12 01:12 +0800) removed it, and those two
#   endpoints answered nothing until it was listed here.
# - `pingclair.aqeo.dev`, the hostname the site moved away from, stays bound so
#   the Worker answers every old link with a permanent redirect.
#
# `pingclair.com` is deliberately absent: since October 2026 the apex is served
# straight from the Paris node, and a custom-domain route on a name that does
# not point at Cloudflare makes every deploy fail at the route step — after the
# assets have already uploaded, so the check reports red on a deployment that in
# fact went live. Each route's zone must live in the same Cloudflare account:
# Wrangler creates the DNS record and the certificate for the hostname.
# Top-level, not inside [assets]: TOML tables swallow every key that follows.
routes = [
	{ pattern = "cf.pingclair.com", custom_domain = true },
	{ pattern = "pingclair.aqeo.dev", custom_domain = true },
]

[assets]
directory = "./dist"
# The script reaches the built site through this binding.
binding = "ASSETS"
# Starlight writes a 404.html, so an unknown path should serve that page rather
# than the asset-server default.
not_found_handling = "404-page"
# The script answers page requests that ask for Markdown, so it has to run
# before the assets server does.
run_worker_first = true
