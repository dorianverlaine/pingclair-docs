# Cloudflare Workers, built from this GitHub repository. Workers Builds runs the
# build command and then `wrangler deploy`, which uploads `dist` as static assets
# and `worker/index.js` as the small script in front of them.
name = "pingclair-docs"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# The docs domain, plus the hostname the site moved away from: it stays bound so
# the Worker can answer every old link with a permanent redirect rather than
# letting the retired address go dark. Deploying with these routes requires both
# zones to live in the same Cloudflare account: Wrangler creates the DNS record
# and the certificate for each hostname. Top-level, not inside [assets]: TOML
# tables swallow every key that follows them.
routes = [
	{ pattern = "pingclair.com", custom_domain = true },
	{ pattern = "pingclair.aqeo.dev", custom_domain = true },
]

[assets]
directory = "./dist"
# The script reaches the built site through this binding.
binding = "ASSETS"
# Starlight writes a 404.html, so an unknown path should serve that page rather
# than the asset-server default.
not_found_handling = "404-page"
# The script answers page requests that ask for Markdown, so it has to run
# before the assets server does.
run_worker_first = true
