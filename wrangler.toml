# Cloudflare Workers, built from this GitHub repository. Workers Builds runs the
# build command and then `wrangler deploy`, which reads the assets directory
# below: the site is served as static assets, not as a Worker script.
name = "pingclair-docs"
compatibility_date = "2026-09-01"

# The docs domain. Deploying with this route requires the aqeo.dev zone to live
# in the same Cloudflare account: Wrangler creates the DNS record and the
# certificate for the hostname. Top-level, not inside [assets]: TOML tables
# swallow every key that follows them.
routes = [{ pattern = "pingclair.aqeo.dev", custom_domain = true }]

[assets]
directory = "./dist"
# Starlight writes a 404.html, so an unknown path should serve that page rather
# than the asset-server default.
not_found_handling = "404-page"
