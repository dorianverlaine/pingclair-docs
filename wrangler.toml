# Cloudflare Workers, built from this GitHub repository. Workers Builds runs the
# build command and then `wrangler deploy`, which uploads `dist` as static assets
# and `worker/index.js` as the small script in front of them.
name = "pingclair-docs"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 🔀 Every hostname the Worker answers on is listed here, because `wrangler
# deploy` makes the Worker's custom domains match this list: a domain bound only
# in the dashboard is detached, DNS record and all, by the next deploy.
#
# - `pingclair.com` and `www.pingclair.com` are the public documentation
#   hostnames. Both serve the same Worker bundle and the canonical links name
#   the apex.
# - `cf.pingclair.com` is the Worker's own hostname, kept for direct checks.
# - `pingclair.aqeo.dev` is deliberately absent. Its DNS records are managed
#   outside the Worker's custom-domain binding and its existing Cloudflare
#   response already redirects every method to the canonical origin. Listing it
#   made an otherwise successful asset upload fail while Wrangler tried to claim
#   the hostname.
#
# Each route's zone must live in the same Cloudflare account: Wrangler creates
# the DNS record and the certificate for the hostname.
# Top-level, not inside [assets]: TOML tables swallow every key that follows.
routes = [
	{ pattern = "pingclair.com", custom_domain = true },
	{ pattern = "www.pingclair.com", custom_domain = true },
	{ pattern = "cf.pingclair.com", custom_domain = true },
]

[assets]
directory = "./dist"
# The script reaches the built site through this binding.
binding = "ASSETS"
# Starlight writes a 404.html, so an unknown path should serve that page rather
# than the asset-server default.
not_found_handling = "404-page"
# The script answers page requests that ask for Markdown, so it has to run
# before the assets server does.
run_worker_first = true
